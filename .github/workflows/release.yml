name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # create GitHub releases
  packages: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli --features opt

      - name: Build optimized contracts
        run: stellar contract build

      - name: Collect WASM artifacts
        run: |
          mkdir -p dist
          for wasm in target/wasm32*/release/*.wasm; do
            name=$(basename "$wasm" .wasm)
            size=$(wc -c < "$wasm")
            cp "$wasm" "dist/${name}.wasm"
            echo "  $name: ${size} bytes"
          done

      - name: Generate release notes
        id: notes
        run: |
          VERSION=${GITHUB_REF_NAME}
          DATE=$(date -u +'%Y-%m-%d')
          echo "## Kredex Contracts ${VERSION} (${DATE})" > release_notes.md
          echo "" >> release_notes.md
          echo "### 📦 Compiled WASM Artifacts" >> release_notes.md
          echo "" >> release_notes.md
          echo "| Contract | Size |" >> release_notes.md
          echo "|---|---|" >> release_notes.md
          for wasm in dist/*.wasm; do
            name=$(basename "$wasm" .wasm)
            size=$(wc -c < "$wasm")
            echo "| \`${name}\` | ${size} bytes |" >> release_notes.md
          done
          echo "" >> release_notes.md
          echo "### ⚠️ Testnet Only" >> release_notes.md
          echo "These contracts are deployed on the Stellar Testnet only and have not been audited." >> release_notes.md
          echo "" >> release_notes.md
          echo "See [CONTRACTS.md](./docs/CONTRACTS.md) for deployed contract IDs." >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.wasm
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

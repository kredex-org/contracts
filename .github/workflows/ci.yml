name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Match the version used locally — bump this when upgrading
  STELLAR_CLI_VERSION: "25.2.0"

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Format check
  # ─────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ─────────────────────────────────────────────
  # Job 2: Clippy lint
  # ─────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (strict)
        run: cargo clippy --all-targets -- -D warnings

  # ─────────────────────────────────────────────
  # Job 3: Unit tests
  # ─────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace --verbose

  # ─────────────────────────────────────────────
  # Job 4: Build WASM artifacts
  # ─────────────────────────────────────────────
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust with wasm32v1-none target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      # Use the official install script — fastest, handles arch automatically
      - name: Install stellar-cli (pre-built)
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/raw/v${STELLAR_CLI_VERSION}/install.sh \
            | sh -s -- --version ${STELLAR_CLI_VERSION}
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build all contracts
        run: stellar contract build

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts-${{ github.sha }}
          path: target/wasm32v1-none/release/*.wasm
          retention-days: 30

  # ─────────────────────────────────────────────
  # Job 5: Contract size reporting (PRs only)
  # ─────────────────────────────────────────────
  size-report:
    name: Contract Size Report
    runs-on: ubuntu-latest
    needs: build-wasm
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust with wasm32v1-none target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - name: Install stellar-cli (pre-built)
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin stellar

      - name: Build contracts
        run: stellar contract build

      - name: Report contract sizes
        run: |
          echo "## 📦 Contract Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | Size (bytes) |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for wasm in target/wasm32v1-none/release/*.wasm; do
            name=$(basename "$wasm" .wasm)
            size=$(wc -c < "$wasm")
            echo "| \`$name\` | $size |" >> $GITHUB_STEP_SUMMARY
          done

name: Deploy to Testnet

on:
  push:
    branches: ["main"]
    paths:
      - "**/src/**"
      - "**/Cargo.toml"
      - "Cargo.toml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build WASM only, skip deploy)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-testnet
  cancel-in-progress: false

env:
  STELLAR_CLI_VERSION: "25.2.0"

jobs:
  deploy:
    name: Build & Deploy Contracts
    runs-on: ubuntu-latest
    environment: testnet

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust with wasm32v1-none target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      # Use the official install script — fastest, handles arch automatically
      - name: Install stellar-cli (pre-built)
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/raw/v${STELLAR_CLI_VERSION}/install.sh \
            | sh -s -- --version ${STELLAR_CLI_VERSION}
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          stellar --version

      - name: Import admin identity
        run: |
          echo "${{ secrets.TESTNET_ADMIN_SECRET }}" | stellar keys add trustlend-admin --secret-key

      - name: Build contracts
        run: stellar contract build

      - name: Deploy contracts (testnet)
        if: ${{ inputs.dry_run != 'true' }}
        id: deploy
        run: |
          set -e
          NETWORK=testnet
          ADMIN=$(stellar keys address trustlend-admin)

          deploy() {
            local name=$1 wasm=$2
            echo "Deploying $name..."
            ID=$(stellar contract deploy \
              --wasm "$wasm" \
              --network $NETWORK \
              --source trustlend-admin 2>&1 \
              | grep -oP 'C[A-Z0-9]{55}' | tail -1)
            echo "${name}=${ID}" >> $GITHUB_OUTPUT
            echo "  ✅ $name: $ID"
          }

          deploy REPUTATION  target/wasm32v1-none/release/borrower_reputation.wasm
          deploy ESCROW      target/wasm32v1-none/release/escrow.wasm
          deploy LENDING     target/wasm32v1-none/release/lending.wasm
          deploy DEFAULT     target/wasm32v1-none/release/default_management.wasm
          deploy LIQUIDITY   target/wasm32v1-none/release/liquidity_pool.wasm
          deploy ORACLE      target/wasm32v1-none/release/oracle_adapter.wasm
          deploy NFT         target/wasm32v1-none/release/reputation_nft.wasm

          echo "ADMIN_ADDRESS=${ADMIN}" >> $GITHUB_OUTPUT

      - name: Print deployment summary
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          echo "## 🚀 Deployed Contract IDs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | ID |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Reputation | \`${{ steps.deploy.outputs.REPUTATION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Escrow | \`${{ steps.deploy.outputs.ESCROW }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Lending | \`${{ steps.deploy.outputs.LENDING }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Default Mgmt | \`${{ steps.deploy.outputs.DEFAULT }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Liquidity Pool | \`${{ steps.deploy.outputs.LIQUIDITY }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Oracle Adapter | \`${{ steps.deploy.outputs.ORACLE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Reputation NFT | \`${{ steps.deploy.outputs.NFT }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-testnet-${{ github.sha }}
          path: target/wasm32v1-none/release/*.wasm
          retention-days: 90

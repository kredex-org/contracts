# Labeler configuration
# Docs: https://github.com/actions/labeler

"contract: reputation":
  - changed-files:
    - any-glob-to-any-file: "borrower_reputation/**"

"contract: nft":
  - changed-files:
    - any-glob-to-any-file: "reputation_nft/**"

"contract: escrow":
  - changed-files:
    - any-glob-to-any-file: "escrow/**"

"contract: lending":
  - changed-files:
    - any-glob-to-any-file: "lending/**"

"contract: insurance":
  - changed-files:
    - any-glob-to-any-file: "default_management/**"

"contract: liquidity-pool":
  - changed-files:
    - any-glob-to-any-file: "liquidity_pool/**"

"contract: oracle":
  - changed-files:
    - any-glob-to-any-file: "oracle_adapter/**"

"area: ci":
  - changed-files:
    - any-glob-to-any-file: ".github/**"

"area: docs":
  - changed-files:
    - any-glob-to-any-file: "docs/**"
    - any-glob-to-any-file: "*.md"

"area: dependencies":
  - changed-files:
    - any-glob-to-any-file: "Cargo.toml"
    - any-glob-to-any-file: "Cargo.lock"
    - any-glob-to-any-file: "**/Cargo.toml"
